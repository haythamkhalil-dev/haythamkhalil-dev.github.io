  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --accent: #0369a1;
      --accent-soft: #e0f2fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #111c33;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --line: #1e2b45;
        --accent: #38bdf8;
        --accent-soft: #0c2a42;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.5;
    }
    main {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 40px 32px 32px;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .headline {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }
    nav {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin: 32px 0 0;
    }
    nav a {
      display: block;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      transition: border-color .15s, background .15s;
    }
    nav a span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-weight: 400;
      font-size: .875rem;
      word-break: break-all;
    }
    nav a:hover, nav a:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }
    .status {
      display: inline-block;
      margin: 28px 0 0;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: .8125rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>

    </nav>

    <p class="status">Full site under construction</p>
  </main>
